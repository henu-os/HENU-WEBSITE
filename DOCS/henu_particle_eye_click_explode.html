      let x = p.ox, y = p.oy, alpha = p.baseA, radius = p.r;
      if (phase === "burst") {
        const localT = clamp((elapsed - p.delay) / Math.max(1, b.burstMs - p.delay), 0, 1);
        const e = easeOutCubic(localT);
        x = p.ox + (p.tx - p.ox) * e;
        y = p.oy + (p.ty - p.oy) * e;
        alpha *= 1 - .48 * e;
        radius *= 1 + .22 * e;
      } else {
        const e = easeInOutCubic(progress);
        x = p.tx + (p.ox - p.tx) * e;
        y = p.ty + (p.oy - p.ty) * e;
        alpha *= .52 + .48 * e;
      }
      ctx.globalAlpha = clamp(alpha, 0, 1);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(x, y, radius, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    requestAnimationFrame(draw);
  }

  canvas.addEventListener("pointerdown", event => {
    if (!maskData) return;
    const rect = canvas.getBoundingClientRect();
    const x = (event.clientX - rect.left) / rect.width * BASE_W;
    const y = (event.clientY - rect.top) / rect.height * BASE_H;
    burstAt(x, y);
  });
  window.addEventListener("resize", resizeCanvas, { passive: true });

  source.onload = buildParticles;
  source.onerror = () => console.error("Particle image failed to load.");
})();
</script>
</body>
</html>
